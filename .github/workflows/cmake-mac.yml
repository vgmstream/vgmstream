name: macOS build

on:
  push:
    branches: [ master, main ]
    tags: [ 'r*' ]
    paths-ignore: ['doc/**', '**.md', 'COPYING', '.gitignore', 'cli/tools/**']
  pull_request:
    paths-ignore: ['doc/**', '**.md', 'COPYING', '.gitignore', 'cli/tools/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  # min version var for cmake (otherwise uses runner's?)
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    name: CMake, macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        # needs history + tags for auto-versioning
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install dependencies
        run: brew install autoconf automake libtool

      - name: Cache celt
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/dependencies/celt-0061
            ${{ github.workspace }}/dependencies/celt-0110
            ${{ github.workspace }}/build/dependencies/celt-0061/libcelt/.libs
            ${{ github.workspace }}/build/dependencies/celt-0110/libcelt/.libs
          key: mac-${{ env.MACOSX_DEPLOYMENT_TARGET }}-celt-${{ hashFiles('cmake/dependencies/celt.cmake') }}

      - name: Cache ffmpeg
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/build/dependencies/ffmpeg/bin/usr/local/include
            ${{ github.workspace }}/build/dependencies/ffmpeg/bin/usr/local/lib
          key: mac-${{ env.MACOSX_DEPLOYMENT_TARGET }}-ffmpeg-${{ hashFiles('cmake/dependencies/ffmpeg.cmake') }}

      - name: Cache mpg123
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/dependencies/mpg123
            ${{ github.workspace }}/build/dependencies/mpg123/src/libmpg123/.libs
          key: mac-${{ env.MACOSX_DEPLOYMENT_TARGET }}-mpg123-${{ hashFiles('cmake/dependencies/mpg123.cmake') }}

      - name: Cache speex
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/build/dependencies/speex/libspeex/.libs
          key: mac-${{ env.MACOSX_DEPLOYMENT_TARGET }}-speex-${{ hashFiles('cmake/dependencies/speex.cmake') }}

      - name: Cache ogg
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/build/dependencies/ogg/libogg.a
            ${{ github.workspace }}/build/dependencies/ogg/include
          key: mac-${{ env.MACOSX_DEPLOYMENT_TARGET }}-ogg-${{ hashFiles('cmake/dependencies/ogg.cmake') }}

      - name: Cache vorbis
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/build/dependencies/vorbis/lib/*.a
          key: mac-${{ env.MACOSX_DEPLOYMENT_TARGET }}-vorbis-${{ hashFiles('cmake/dependencies/vorbis.cmake') }}

      - name: Build
        run: |
          cmake -S . -B build -DBUILD_AUDACIOUS:BOOL=OFF -DBUILD_STATIC=ON -DCMAKE_BUILD_TYPE=$BUILD_TYPE
          cmake --build build
          strip build/cli/vgmstream-cli

      - name: Upload CLI tools
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}/build/cli/vgmstream-cli
          name: vgmstream-mac

      # uploads current assets to vgmstream-releases (token only works on merges)
      - name: Upload artifacts to vgmstream-releases
        if: github.event_name != 'pull_request'
        working-directory: ${{github.workspace}}
        shell: bash
        env:
          UPLOADER_GITHUB_TOKEN: ${{ secrets.UPLOADER_GITHUB_TOKEN }}
        run: |
          tar cvfz vgmstream-mac-cli.tar.gz -C ./build/cli vgmstream-cli
          python3 .github/uploader.py vgmstream-mac-cli.tar.gz
