name: Build vgmstream ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install toolchain
      run: |
        sudo apt update

        sudo apt install -y \
          gcc-aarch64-linux-gnu \
          g++-aarch64-linux-gnu \
          cmake \
          make \
          pkg-config \
          git

    - name: Configure
      run: |
        mkdir build
        cd build

        cmake .. \
          -DCMAKE_SYSTEM_NAME=Linux \
          -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++

    - name: Build
      run: |
        cd build
        make -j$(nproc)

    - name: Verify
      run: |
        find build -type f -executable || true

    - name: Package
      run: |
        mkdir release

        find build -name "vgmstream-cli" -exec cp {} release/ \; || true
        find build -name "vgmstream123" -exec cp {} release/ \; || true

        tar -czf vgmstream-arm64.tar.gz release

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: vgmstream-arm64
        path: vgmstream-arm64.tar.gz
